name: Build Windows VST3

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar (CMake + JUCE)
        run: cmake -S . -B build -A x64

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Testes do processamento de audio
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validar o plugin (pluginval)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          # pluginval é um app de janela: esperar ele terminar e ler o código de saída
          $p = Start-Process -FilePath .\pluginval\pluginval.exe -Wait -PassThru -NoNewWindow -ArgumentList @(
            '--strictness-level', '8', '--skip-gui-tests', '--validate-in-process',
            '--validate', '"build\NiveladorVMix_artefacts\Release\VST3\Nivelador vMix.vst3"')
          Write-Host "pluginval terminou com codigo $($p.ExitCode)"
          exit $p.ExitCode

      - name: Empacotar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build\NiveladorVMix_artefacts\Release\VST3\Nivelador vMix.vst3" dist\
          Copy-Item LEIA-ME.md dist\
          Compress-Archive -Path dist\* -DestinationPath Nivelador-vMix-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Nivelador-vMix-Windows-x64
          path: Nivelador-vMix-Windows-x64.zip

      - name: Publicar release (quando houver tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Nivelador-vMix-Windows-x64.zip
